name: "Build Fork Image"

# Builds and pushes the homelab fork image to
# ghcr.io/yordis/postiz-app:feat-x-oauth-v1-fallback.
# Single workflow (not the upstream tag-driven build-containers.yml) so
# bumps land via a normal branch push.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/x-oauth-v1-fallback

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          # Replace `/` with `-` so the branch name is a valid OCI tag.
          tag="${GITHUB_REF_NAME//\//-}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/yordis/postiz-app:${{ steps.tag.outputs.tag }}
            ghcr.io/yordis/postiz-app:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
